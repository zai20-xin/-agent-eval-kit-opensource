# CI 门禁：pytest + 落位门禁 + 懒加载硬验收
#
# 为什么用 Actions：pre-commit hook 只在本机生效（.git/hooks 不入库），
# 换机器 / 直接 push 的改动没有这道闸 —— CI 是唯一能保证「每次 push 都过」的机制。
# 与 tools/layout_gate.py 同源：宁可少拦，不要误拦（见门禁铁律）。
#
# 本地等价命令：
#   .venv/bin/pip install -e ".[dev]"
#   .venv/bin/python3 -m pytest
#   .venv/bin/python3 tools/layout_gate.py
#   .venv/bin/python3 -c "import evalkit.cli,sys; assert not any(m.startswith('evalkit.suites.') for m in sys.modules)"

name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + layout_gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (dev extra)
        run: pip install -e ".[dev]"

      - name: layout_gate (full)
        run: python tools/layout_gate.py

      - name: pytest
        run: python -m pytest

      - name: pure-script selftest (no-pytest path stays green)
        run: python -m evalkit.tests

      - name: lazy import hard acceptance
        # import evalkit.cli 必须零 suites 加载（PEP 562 懒 shim 不破）
        run: |
          python - <<'PY'
          import sys
          import evalkit.cli
          loaded = [m for m in sys.modules if m.startswith("evalkit.suites.")]
          assert not loaded, f"suites loaded on import evalkit.cli: {loaded}"
          print("lazy OK")
          PY
